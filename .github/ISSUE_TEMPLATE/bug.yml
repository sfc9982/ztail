name: Bug report / 缺陷报告
description: Report a reproducible problem using synthetic, non-sensitive data.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, read SECURITY.md first. Do not post production logs or secrets."
  - type: textarea
    id: build
    attributes:
      label: Build and environment
      description: "Paste ztail --build-info, OS/kernel, shell, and whether stdout/stderr are terminals or pipes."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: "Exact command and synthetic input; for follow issues include append/flush/rename/truncation steps."
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: "Include sanitized stdout, stderr, and exit status. Do not upload private log files."
    validations:
      required: true
