name: Dependency audit

on:
  push:
    paths: ["Cargo.toml", "Cargo.lock", ".github/workflows/security.yml"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", ".github/workflows/security.yml"]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Check RustSec advisories
        run: cargo audit --no-yanked
