name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: MSRV and packaging checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0
        with:
          toolchain: 1.85.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --locked --all-targets --all-features
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  build:
    name: ${{ matrix.target }} (${{ matrix.flavor }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            flavor: minimal
            features: ""
          - target: x86_64-unknown-linux-gnu
            flavor: zstd
            features: "--all-features"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate release tag and license
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          package = json.loads(subprocess.check_output([
              'cargo', 'metadata', '--no-deps', '--format-version', '1'
          ]))['packages'][0]
          assert os.environ['RELEASE_REF'].startswith('refs/tags/v'), 'Select a version tag, not a branch'
          assert os.environ['RELEASE_TAG'] == 'v' + package['version'], 'Tag/version mismatch'
          assert package.get('license'), 'Choose and declare a distribution license first'
          assert any(p.is_file() for p in pathlib.Path('.').glob('LICENSE*')), 'Add full license text first'
          PY
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install musl toolchain
        if: matrix.flavor == 'minimal'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo test --locked --all-targets ${{ matrix.features }}
      - run: cargo test --locked --doc ${{ matrix.features }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} ${{ matrix.features }}
      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/package.py \
            --binary target/${{ matrix.target }}/release/ztail \
            --target ${{ matrix.target }} --flavor ${{ matrix.flavor }} \
            --tag "$RELEASE_TAG" --output dist
          (cd dist && sha256sum -c *.sha256)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.target }}-${{ matrix.flavor }}
          path: dist/*
          if-no-files-found: error

  draft:
    needs: [build, verify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify and create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum -c *.sha256)
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "ztail $RELEASE_TAG" --notes-file CHANGELOG.md dist/*
