name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Packaging unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (default features)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (zstd)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Test with zstd
        run: cargo test --locked --all-targets --all-features
      - name: Source install/uninstall smoke test
        run: python3 scripts/check_install.py --all-features
      - name: Doctests
        run: cargo test --locked --doc --all-features
      - name: Docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --all-features

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.85.0
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # proptest is pinned to ~1.11 because 1.12 needs Rust 1.88. If another
      # dev-dependency ever raises its MSRV, narrow this to `--lib --bins`
      # (dropping `--all-targets`) rather than deleting the job.
      - name: Check
        run: cargo check --locked --all-targets --all-features

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Generate lcov report
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info
      - name: Print coverage summary
        run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

  musl:
    name: static musl release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Release build
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Binary is statically linked
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/ztail
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie'
          # `ldd` exits 0 and prints "statically linked" for static-pie, and
          # exits non-zero with "not a dynamic executable" for some other
          # static builds. Either is fine; a dynamic binary lists `=>` deps.
          ldd_out=$(ldd "$bin" 2>&1 || true)
          printf '%s\n' "$ldd_out"
          if printf '%s\n' "$ldd_out" | grep -q '=>'; then
            echo "release binary has dynamic dependencies"
            exit 1
          fi
          printf '%s\n' "$ldd_out" | grep -Eq 'statically linked|not a dynamic executable'
          "$bin" --version
      - name: Smoke-test release archive (not for distribution)
        run: |
          python3 scripts/package.py \
            --binary target/x86_64-unknown-linux-musl/release/ztail \
            --target x86_64-unknown-linux-musl --flavor minimal \
            --output target/dist-smoke --allow-unlicensed
          (cd target/dist-smoke && sha256sum -c *.sha256)
