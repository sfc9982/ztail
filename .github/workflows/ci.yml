name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (zstd)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Test with zstd
        run: cargo test --all-targets --all-features

  musl:
    name: static musl release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Release build
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Binary is statically linked
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/ztail
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie'
          # `ldd` exits 0 and prints "statically linked" for static-pie, and
          # exits non-zero with "not a dynamic executable" for some other
          # static builds. Either is fine; a dynamic binary lists `=>` deps.
          ldd_out=$(ldd "$bin" 2>&1 || true)
          printf '%s\n' "$ldd_out"
          if printf '%s\n' "$ldd_out" | grep -q '=>'; then
            echo "release binary has dynamic dependencies"
            exit 1
          fi
          printf '%s\n' "$ldd_out" | grep -Eq 'statically linked|not a dynamic executable'
          "$bin" --version
